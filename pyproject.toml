[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "AI Data Analyst - Multi-Agent Data Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "kaggle>=1.5.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]
