[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "AI Data Analyst - Multi-Agent Data Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "kaggle>=1.5.0",
    "groq>=0.9.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.pyright]
include = ["apps", "packages", "tests", "main.py", "orchestrator.py"]
extraPaths = [
    ".",
    "apps/api",
    "packages/agent",
    "packages/analytics",
    "packages/evidence",
    "packages/ingestion",
    "packages/shared",
    "packages/sql",
    "packages/visualization",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
